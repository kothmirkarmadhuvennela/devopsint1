<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #bfdbfe;
      border-color: #2563eb;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 16px 0 20px;
      font-size: 0.9rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .signup {
      margin: 20px 0 0;
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <form action="/login" method="post">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="signup">Don't have an account? <a href="/signup">Sign up</a></p>
  </main>
</body>
</html>
